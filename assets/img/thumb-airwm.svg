<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="A frame enters only the update of z L. z L and z H update each other once per step, and the next frame is read from z H."><style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.d1,.d2,.d3,.rL,.rH,.rN{opacity:0}@media (prefers-reduced-motion:no-preference){@keyframes d1{0.00%{transform:translateX(0);opacity:0}2.00%{transform:translateX(0);opacity:1}14.00%{transform:translateX(28px);opacity:1}15.00%{transform:translateX(28px);opacity:0}100.00%{transform:translateX(0);opacity:0}}@keyframes rL{0.00%{opacity:0}13.00%{opacity:0}16.00%{opacity:1}30.00%{opacity:1}34.00%{opacity:0}100.00%{opacity:0}}@keyframes d2{0.00%{transform:translateY(0);opacity:0}30.00%{transform:translateY(0);opacity:0}32.00%{transform:translateY(0);opacity:1}44.00%{transform:translateY(34px);opacity:1}45.00%{transform:translateY(34px);opacity:0}100.00%{transform:translateY(0);opacity:0}}@keyframes rH{0.00%{opacity:0}43.00%{opacity:0}46.00%{opacity:1}60.00%{opacity:1}64.00%{opacity:0}100.00%{opacity:0}}@keyframes d3{0.00%{transform:translateX(0);opacity:0}60.00%{transform:translateX(0);opacity:0}62.00%{transform:translateX(0);opacity:1}74.00%{transform:translateX(28px);opacity:1}75.00%{transform:translateX(28px);opacity:0}100.00%{transform:translateX(0);opacity:0}}@keyframes rN{0.00%{opacity:0}73.00%{opacity:0}76.00%{opacity:1}92.00%{opacity:1}97.00%{opacity:0}100.00%{opacity:0}}.d1{animation:d1 8.0s linear infinite}.rL{animation:rL 8.0s linear infinite}.d2{animation:d2 8.0s linear infinite}.rH{animation:rH 8.0s linear infinite}.d3{animation:d3 8.0s linear infinite}.rN{animation:rN 8.0s linear infinite}}</style><rect x="0" y="0" width="320" height="200" rx="0" fill="#faf9f6" /><rect x="10" y="30" width="86" height="40" rx="6" fill="#dcf0e4" stroke="#3fa56f" stroke-width="2"/><text x="53" y="56" font-size="19" fill="#23704a" text-anchor="middle" font-weight="600">frame</text><line x1="99" y1="50" x2="119"